services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  superset:
    build: ./superset
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    ports:
      - '8088:8088'
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_home:/app/superset_home
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail http://localhost:8088/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    command: >
      bash -c "
      superset db upgrade &&
      superset fab create-admin --username $$SUPERSET_ADMIN_USERNAME --firstname $$SUPERSET_ADMIN_FIRSTNAME --lastname $$SUPERSET_ADMIN_LASTNAME --email $$SUPERSET_ADMIN_EMAIL --password $$SUPERSET_ADMIN_PASSWORD || true &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088"

  seed:
    build: ./superset/seed
    profiles: ['tools']
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      OWID_DB_NAME: ${POSTGRES_MULTIPLE_DATABASES}

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      superset:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      SUPERSET_URL: http://superset:8088
    ports:
      - '3001:3001'

volumes:
  postgres_data:
  superset_home:
